<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat Interface</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Overlay (Mobile) -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="btn btn-primary new-chat-btn" title="Start new conversation">
                    ✨ New Chat
                </button>
                <button id="toggle-sidebar-btn" class="btn btn-ghost toggle-sidebar-btn" title="Toggle sidebar">
                    ◀
                </button>
            </div>
            
            <div class="conversations-list" id="conversations-list">
                <div class="conversations-loading" id="conversations-loading">
                    <div class="loading-spinner"></div>
                    <span>Loading conversations...</span>
                </div>
                <div class="conversations-empty" id="conversations-empty" style="display: none;">
                    <div class="empty-icon">💬</div>
                    <p>No conversations yet</p>
                    <small>Start a new chat to get began</small>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-content" id="main-content">
            <!-- Floating Sidebar Toggle (Desktop) -->
            <button id="floating-sidebar-toggle" class="floating-sidebar-toggle" style="display: none;" title="Open sidebar">
                ▶
            </button>

            <!-- Header -->
            <header class="chat-header">
                <div class="header-content">
                    <div class="header-left">
                        <button id="toggle-sidebar-mobile" class="btn btn-ghost sidebar-toggle-mobile" title="Toggle sidebar">
                            ☰
                        </button>
                        <h1 class="app-title">
                            <span class="ollama-icon">🦙</span>
                            <span id="current-conversation-title">Ollama Chat</span>
                        </h1>
                    </div>
                    <div class="model-selector-container">
                        <label for="model-select" class="model-label">Model:</label>
                        <select id="model-select" class="model-select">
                            <option value="">Loading models...</option>
                        </select>
                    </div>
                    <div class="header-actions">
                        <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode">
                            <span class="theme-toggle-icon" id="theme-icon">🌙</span>
                        </button>
                        <button id="clear-chat" class="btn btn-secondary" title="Clear conversation" disabled>
                            🗑️ Clear
                        </button>
                        <div class="status-indicator" id="status-indicator">
                            <span class="status-dot"></span>
                            <span class="status-text">Connecting...</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Chat Container -->
            <main class="chat-container">
                <!-- Messages Area -->
                <div class="messages-container" id="messages-container">
                    <div class="welcome-message">
                        <div class="welcome-icon">👋</div>
                        <h2>Welcome to Ollama Chat!</h2>
                        <p>Select a model and start chatting with your local AI assistant.</p>
                    </div>
                </div>

                <!-- Typing Indicator -->
                <div class="typing-indicator" id="typing-indicator" style="display: none;">
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <span class="typing-text">AI is thinking...</span>
                </div>
            </main>

            <!-- Input Area -->
            <footer class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="message-input" 
                        class="message-input" 
                        placeholder="Type your message here... (Shift + Enter for new line)"
                        rows="1"
                    ></textarea>
                    <button id="send-button" class="send-button" disabled title="Send message">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="m22 2-7 20-4-9-9-4z"/>
                            <path d="m22 2-11 11"/>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">
                    Press Enter to send, Shift + Enter for new line
                </div>
            </footer>
        </div>
    </div>

    <!-- Conversation Context Menu -->
    <div class="context-menu" id="conversation-context-menu" style="display: none;">
        <button class="context-menu-item" id="rename-conversation">
            ✏️ Rename
        </button>
        <button class="context-menu-item" id="delete-conversation">
            🗑️ Delete
        </button>
    </div>

    <!-- Rename Dialog -->
    <div class="modal-overlay" id="rename-modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3>Rename Conversation</h3>
                <button class="modal-close" id="rename-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="rename-input" class="modal-input" placeholder="Enter new title...">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="rename-cancel">Cancel</button>
                <button class="btn btn-primary" id="rename-confirm">Save</button>
            </div>
        </div>
    </div>

    <!-- Error Toast -->
    <div class="toast" id="error-toast">
        <div class="toast-content">
            <span class="toast-icon">❌</span>
            <span class="toast-message" id="error-message"></span>
        </div>
        <button class="toast-close" onclick="hideToast()">&times;</button>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- Syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
